type: DataProduct
version: 1
parent: Asset
identity:
  qualified_name: fabric.id
attributes:
  name: { type: string, required: true, source: fabric }
  fabric_id: { type: string, source: fabric }
  owner: { type: person, source: fabric }
edges:
  in_domain:
    - { to: DataDomain, cardinality: many-to-one }
  owned_by:
    - { to: Party, cardinality: many-to-one }
  stewarded_by:
    - { to: Party, cardinality: many-to-one }
  governed_by:
    - { to: Policy, cardinality: many-to-many }
lifecycle: default
controls: []
