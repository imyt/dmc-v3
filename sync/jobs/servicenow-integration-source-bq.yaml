# S6 (INVENTED SCHEMA, see servicenow-integrations-bq): Application source_of Integration. Both ends must exist: run after servicenow-applications-bq and servicenow-integrations-bq.
# An integration whose source application is not in the catalog (unknown, or not synced yet) is refused and reported, not recorded as seen, and sent again next run (ADR 0024).
job: servicenow-integration-source-bq
connection: bq-servicenow
schedule: "55 2 * * *"
source:
  query: "SELECT sys_id, source_app FROM `${project}.${dataset}.integrations` WHERE source_app IS NOT NULL"
  mode: full
  page_size: 1000
target:
  type: Application
  source: servicenow
  edge: { name: source_of, qualified_name: "{source_app}", to_qualified_name: "{sys_id}", from: ".", to: "." }
  map: { record: sys_id }
  on_missing: deprecate
limits: { max_changes_pct: 30 }
retries: { max: 2, backoff_seconds: 5 }
