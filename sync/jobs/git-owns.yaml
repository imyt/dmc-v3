# S7: Application owns System: the application whose repo holds the system.
# Both ends must exist: run after the node jobs (and after the ServiceNow applications job for owns). The repo is kept on the edge as its provenance.
job: git-owns
connection: git-repos
schedule: "5 3 * * *"
source: { query: "git-json ${git_repos} ${applications_file} owns", mode: full }
target:
  type: Application
  edge:
    name: owns
    qualified_name: "{qn}"
    from: from
    to: to
  source: git-json
  map: { repo: repo }
  on_missing: deprecate
limits: { max_changes_pct: 30 }
retries: { max: 2, backoff_seconds: 5 }
