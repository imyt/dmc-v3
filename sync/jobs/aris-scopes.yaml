# Task S11 (ARIS). The access method for this system is not known yet, so it reads a recorded inventory (sync/fixtures/aris-processes.json) through the REST connector.
# Scope name, owner and kind are owned by the scope sources; groups, elements, flows and tier stay with DMC (CAT-9).
job: aris-scopes
connection: mock-aris
schedule: "0 2 * * *"
source: { query: "/v1/aris-processes", mode: full, page_size: 500 }
target:
  type: Scope
  key: process_id
  source: scope-sources
  map: { name: process_name, owner: process_owner_sid, kind: kind }
  on_missing: deprecate
limits: { max_changes_pct: 30 }
retries: { max: 2, backoff_seconds: 5 }
